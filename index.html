<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@400;600&display=swap');

:root {
  --navy: #1D2B4F;
  --lavender: #C5B4E3;
  --pink: #F19FC2;
  --pearl: #FAF8FF;
  --ink: #1A1A2E;
  --mist: #EDE8F7;
  --mud: #8A6A4F;

}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--pearl); }
body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink); font-size: 14px; line-height: 1.45;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 1rem) env(safe-area-inset-left);
}

header { background: var(--navy); color: var(--pearl); padding: 1.4rem 1rem 1.1rem; position: relative; overflow: hidden; }
header .puddle { position: absolute; border-radius: 50%; background: rgba(150,110,74,0.8); }
header .puddle.p1 { width: 130px; height: 34px; right: -14px; bottom: 2px; }
header .puddle.p2 { width: 80px;  height: 22px; right: 100px; bottom: 24px; opacity: 0.55; }
header .inner { position: relative; z-index: 2; max-width: 920px; margin: 0 auto; }
header .brand { font-family: 'Caveat', cursive; font-size: 1.25rem; color: var(--lavender); }
header h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.75rem; margin: 0.2rem 0 0.15rem; }
header .meta { font-size: 0.7rem; color: var(--lavender); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
header .countdown { display: inline-block; margin-top: 0.55rem; background: var(--pink); color: var(--navy); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.22rem 0.6rem; border-radius: 999px; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--pearl); padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--mist); }
.bar .row { display: flex; gap: 0.5rem; align-items: center; }
.bar .row + .row { margin-top: 0.5rem; }
.bar .pct { font-weight: 800; font-size: 0.75rem; color: var(--navy); min-width: 38px; text-align: right; }
.bar .track { flex: 1; height: 5px; background: var(--mist); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--navy)); width: 0; transition: width 0.3s; }
.bar .reset { background: transparent; border: 1px solid var(--lavender); color: var(--navy); padding: 0.2rem 0.5rem; font-size: 0.7rem; border-radius: 4px; cursor: pointer; font-weight: 700; }
.bar button.tab { flex: 1; background: transparent; border: 1.5px solid var(--lavender); color: var(--navy); font-family: 'Nunito'; font-weight: 700; font-size: 0.78rem; padding: 0.42rem 0.4rem; border-radius: 6px; cursor: pointer; }
.bar button.tab.active { background: var(--navy); color: var(--pearl); border-color: var(--navy); }
.bar .filters { display: flex; gap: 0.3rem; overflow-x: auto; padding-bottom: 0.15rem; }
.bar .filters button { flex: 0 0 auto; background: transparent; border: 1px solid var(--lavender); color: var(--navy); font-family: 'Nunito'; font-weight: 700; font-size: 0.72rem; padding: 0.32rem 0.7rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.bar .filters button.active { background: var(--navy); color: var(--pearl); border-color: var(--navy); }
.bar .filters button.star-f { border-color: var(--urgent); color: var(--urgent); }

.pax { display: flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.8rem; background: var(--mist); border-bottom: 1px solid var(--lavender); font-size: 0.75rem; font-weight: 700; color: var(--navy); }
.pax .grp { display: flex; align-items: center; gap: 0.3rem; background: #fff; border: 1px solid var(--lavender); border-radius: 999px; padding: 0.15rem 0.3rem; }
.pax .grp span.lbl { padding: 0 0.25rem; }
.pax .grp button { width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--navy); color: var(--pearl); font-weight: 800; font-size: 0.85rem; line-height: 1; cursor: pointer; }
.pax .grp .val { min-width: 20px; text-align: center; font-weight: 800; font-size: 0.85rem; }
.pax .hint { flex: 1; text-align: right; font-weight: 600; font-size: 0.66rem; color: var(--navy); opacity: 0.6; text-transform: uppercase; letter-spacing: 0.06em; }

main { padding: 0.6rem 0.6rem 4rem; max-width: 920px; margin: 0 auto; }

.grp-head { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.2rem; color: var(--navy); margin: 1.1rem 0 0.4rem; padding: 0 0.3rem 0.25rem; border-bottom: 1.5px solid var(--lavender); display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.grp-head .ct { font-family: 'Nunito'; font-size: 0.62rem; color: var(--navy); opacity: 0.55; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; white-space: nowrap; }
.grp-head .when { font-family: 'Nunito'; font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pink); }
.grp-head .when.late { color: var(--urgent); }
.latebar { background: var(--urgent); color: #fff; font-size: 0.75rem; font-weight: 700; padding: 0.5rem 0.85rem; border-radius: 8px; margin: 0.4rem 0 0.2rem; }
.latebar b { font-weight: 800; }

.card { background: #fff; border: 1px solid var(--mist); border-radius: 8px; overflow: hidden; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; align-items: flex-start; gap: 0.7rem; padding: 0.62rem 0.85rem; border-bottom: 1px solid var(--mist); cursor: pointer; }
ul.list li:last-child { border-bottom: none; }
ul.list li:active { background: var(--mist); }
ul.list li .box { flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px; border: 2px solid var(--navy); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
ul.list li .box::after { content: "✓"; color: var(--pearl); font-weight: 800; font-size: 0.8rem; opacity: 0; }
ul.list li.done .box { background: var(--navy); }
ul.list li.done .box::after { opacity: 1; }
ul.list li.done .text .nm { color: var(--lavender); text-decoration: line-through; }
ul.list li.done .text .note, ul.list li.done .text .qty { opacity: 0.4; }
ul.list li.star .box { border-color: var(--urgent); }
ul.list li.star.done .box { background: var(--urgent); }
ul.list li .text { flex: 1; min-width: 0; }
ul.list li .text .nm { font-size: 0.93rem; font-weight: 600; }
ul.list li .text .qty { display: inline-block; background: rgba(197,180,227,0.3); color: var(--navy); font-weight: 800; font-size: 0.72rem; padding: 0.05rem 0.4rem; border-radius: 4px; margin-left: 0.35rem; vertical-align: 1px; }
ul.list li .text .who { display: inline-block; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--grass); border: 1px solid var(--grass); padding: 0.02rem 0.32rem; border-radius: 3px; margin-left: 0.35rem; vertical-align: 1.5px; }
ul.list li .text .note { display: block; font-size: 0.73rem; color: var(--navy); opacity: 0.62; margin-top: 0.15rem; }
ul.list li.star .text .nm::after { content: " ⭐"; font-size: 0.72rem; }

/* Run of show */
.tl { position: relative; padding-left: 0.2rem; }
.slot { display: flex; gap: 0.75rem; align-items: stretch; }
.slot .rail { flex: 0 0 62px; text-align: right; padding-top: 0.9rem; }
.slot .rail .t { font-family: 'Nunito'; font-weight: 800; font-size: 0.78rem; color: var(--navy); }
.slot .rail .t2 { font-size: 0.65rem; color: var(--navy); opacity: 0.5; font-weight: 700; }
.slot .spine { flex: 0 0 14px; position: relative; }
.slot .spine::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--mist); }
.slot:first-child .spine::before { top: 1rem; }
.slot:last-child .spine::before { bottom: calc(100% - 1rem); }
.slot .dot { position: absolute; left: 1px; top: 0.95rem; width: 12px; height: 12px; border-radius: 50%; background: var(--lavender); border: 2px solid var(--pearl); }
.slot.key .dot { background: var(--pink); }
.slot.prep .dot { background: var(--mud); }
.slot .body { flex: 1; padding: 0.7rem 0 0.7rem; min-width: 0; }
.slot .body h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.15rem; color: var(--navy); margin: 0 0 0.15rem; }
.slot.key .body h3::before { content: "● "; color: var(--pink); font-size: 0.7rem; vertical-align: 3px; }
.slot .body p { margin: 0; font-size: 0.82rem; color: var(--ink); opacity: 0.82; }
.slot .body .tags { margin-top: 0.3rem; display: flex; flex-wrap: wrap; gap: 0.25rem; }
.slot .body .tags span { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; padding: 0.1rem 0.4rem; border-radius: 3px; background: var(--mist); color: var(--navy); }

.callout { background: #fff; border: 1px solid var(--mist); border-left: 4px solid var(--pink); border-radius: 8px; padding: 0.8rem 0.9rem; margin: 0.9rem 0; }
.callout h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--navy); margin: 0 0 0.3rem; }
.callout p { margin: 0 0 0.4rem; font-size: 0.83rem; }
.callout p:last-child { margin-bottom: 0; }
.callout.mud { border-left-color: var(--mud); }
.callout.grass { border-left-color: var(--grass); }

.footer-note { text-align: center; font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--lavender); margin-top: 1.6rem; padding: 0.5rem 0; }

[hidden] { display: none !important; }

@media print {
  .bar, .pax { position: static; }
  body { background: #fff; padding: 0.8cm; font-size: 11px; }
  header { background: #fff; color: var(--navy); padding: 0 0 0.6cm; }
  header h1, header .brand, header .meta, header .countdown { color: var(--navy); background: none; }
  header .puddle { display: none; }
  ul.list li { break-inside: avoid; }
}
</style>
</head>

<header>
  <div class="inner">
    <div class="puddle p1"></div>
    <div class="puddle p2"></div>

  <div class="grp"><span class="lbl">Adults</span><button onclick="bump('adults',-1)">–</button><span class="val" id="v-adults">14</span><button onclick="bump('adults',1)">+</button></div>

</div>

<main>
  <div id="todo-view"></div>
  <div id="shop-view" hidden></div>
  <div id="run-view" hidden></div>
</main>

<div class="footer-note">happy birthday, little one ✶</div>

<script>
const STORE_KEY = 'smck-peppa-lily-v1';
const PARTY = new Date('2026-09-19T16:30:00+08:00');

/* ---------- state ---------- */
let S = { done: {}, kids: 12, adults: 14 };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- helpers that scale with headcount ---------- */
const K = () => S.kids, A = () => S.adults, TOT = () => S.kids + S.adults;
const batches = () => Math.ceil((K() * 3 + A() * 3) / 12);   // ~12 pancakes per 250g batch, 3 each
const upto = (n, step) => Math.ceil(n / step) * step;
function cakeCall() {
  const t = TOT();
  if (t <= 14) return '8-inch';
  if (t <= 22) return '8-inch + 6-inch';
  return '2 × 8-inch';
}

/* ---------- TO-DO ---------- */
const PHASES = [
  { key: 'p0', label: 'Lock it in',    when: 'by Sun 30 Aug',        due: '2026-08-30' },
  { key: 'p1', label: 'Two weeks out', when: 'by Sat 5 Sep',         due: '2026-09-05' },
  { key: 'p2', label: 'One week out',  when: 'by Fri 11 Sep',        due: '2026-09-11' },
  { key: 'p3', label: 'Party week',    when: 'Wed 16 – Fri 18 Sep',  due: '2026-09-18' },
  { key: 'p4', label: 'Party day',     when: 'Sat 19 Sep',           due: '2026-09-19' },
];

const TODO = [
  // ---- p0 : lock it in
  {id:'t-book',   p:'p0', star:true, who:'Michelle', nm:'Book the function room + pool, 2:30–8:30pm',
   note:'Book the whole block, not 4:30–8 — you need 2 hours to set up and 30 min to clear. Everything below assumes this is confirmed.'},
  {id:'t-rules',  p:'p0', star:true, who:'Michelle', nm:'Check the house rules while booking',
   note:'Five answers you need: max pax · pool guest limit · can you stick anything to walls/doors · is heating/cooking food allowed · music + end-time cut-off. Also the deposit amount.'},
  {id:'t-guests', p:'p0', who:'Michelle', nm:'Finalise the guest list',
   note:'Evie first — Lily asks for her by name. Count kids and adults separately, then set the numbers at the top of this page.'},

  {id:'t-tinsel', p:'p0', nm:'Find the tinsel fringe curtain + check the door width',

  {id:'t-shopee', p:'p0', star:true, who:'Michelle', nm:'Place the Shopee / Lazada order',
   note:'Longest lead time of anything on this list. Order it the same day you confirm the room — everything decorative hangs off this one basket.'},
  {id:'t-outfit', p:'p0', nm:'Check Lily has a Peppa dress that still fits',
   note:'If not, add it to the same Shopee order rather than a second one later.'},

  // ---- p1 : two weeks out
  {id:'t-invite', p:'p1', star:true, who:'Michelle', nm:'Send the invites (WhatsApp)',
   note:'Must say: swimsuit + towel + a full change of clothes, and dinner is provided. RSVP by Fri 11 Sep — the cake and the goodie bags both key off that number.'},
  {id:'t-pool',   p:'p1', star:true, nm:'Line up pool supervision — 2 adults in the water, named',
   note:'A dozen small children and a pool is the one thing on this page that actually matters. Agree it now with two specific people, not "we’ll see on the day".'},
  {id:'t-print',  p:'p1', nm:'Print the pin-the-tail poster (A1) + Peppa colouring sheets',
   note:'Any print shop does A1 same-day. Colouring sheets — 20 copies on the home printer.'},
  {id:'t-tables', p:'p1', nm:'Confirm what furniture the room already has',
   note:'If it has no long tables you need two folding ones: pancake station + craft station must be separate.'},
  {id:'t-playlist', p:'p1', nm:'Make the Peppa playlist + charge the speaker',

  // ---- p2 : one week out
  {id:'t-head',  p:'p2', star:true, who:'Michelle', nm:'Lock the headcount from RSVPs',
   note:'Then set kids/adults at the top of this page — the shopping quantities and cake size all recompute from it.'},
  {id:'t-cake',  p:'p2', star:true, who:'Michelle', nm:'Order the Awfully Chocolate cake for Fri 18 Sep delivery',
   note:'Plain top, no writing — you are piping the grass yourself. Delivery window 2–6pm. Standard cakes need only a day, but order a week out so the slot is yours.'},
  {id:'t-goodie', p:'p2', who:'Michelle', nm:'Assemble the goodie bags',

const STORES = [
  { key: 's1', label: 'Shopee / Lazada',   when: 'order by Sun 30 Aug', due: '2026-08-30' },
  { key: 's2', label: 'Craft — Spotlight / Art Friend', when: 'by Sat 5 Sep', due: '2026-09-05' },
  { key: 's3', label: 'Phoon Huat',        when: 'Thu 17 Sep',          due: '2026-09-17' },
  { key: 's4', label: 'Awfully Chocolate', when: 'order by Wed 16 Sep', due: '2026-09-16' },
  { key: 's5', label: 'Supermarket',       when: 'Thu 17 Sep',          due: '2026-09-17' },
  { key: 's6', label: 'Already at home — confirm', when: 'by Sun 30 Aug', due: '2026-08-30' },
];

const SHOP = [
  // ---- s1 Shopee / Lazada
  {id:'s-figs',   s:'s1', star:true, nm:'Peppa cake figurine set', q:'1 set', note:'Peppa, George, Mummy, Daddy. The centrepiece of the cake — order it first and check it arrives.'},
  {id:'s-foil',   s:'s1', nm:'Peppa + George foil balloons', q:'1 set'},
  {id:'s-num3',   s:'s1', star:true, nm:'Number "3" foil balloon, pink', q:'1', note:'This is the one in every photo.'},
  {id:'s-latex',  s:'s1', nm:'Latex balloons — pink, red, white, pale blue', q:() => upto(TOT() * 3, 50) + ' pcs', note:'Peppa’s palette. Clusters, not an arch — most function rooms will not let you fix anything to the walls.'},
  {id:'s-pump',   s:'s1', nm:'Balloon pump + curling ribbon + glue dots', q:'1 set'},

/* ---------- render ---------- */
let view = 'todo', filter = 'all';

function isDone(id) { return !!S.done[id]; }
function toggle(id) { if (S.done[id]) delete S.done[id]; else S.done[id] = 1; save(); render(); }
function bump(k, d) { S[k] = Math.max(0, S[k] + d); save(); render(); }
function resetAll() { S.done = {}; save(); render(); }

function val(v) { return typeof v === 'function' ? v() : v; }

/* A group is late when its date has passed and something in it is still open.
   Derived from today's date — nothing to keep up to date by hand. */
function pastDue(due) { return due ? new Date(due + 'T23:59:59+08:00') < new Date() : false; }
function groupFor(it) {
  return (it.p ? PHASES : STORES).find(g => g.key === (it.p || it.s));
}
function isLate(it) {
  const g = groupFor(it);
  return !!g && pastDue(g.due) && !isDone(it.id);
}
function lateCount() { return TODO.concat(SHOP).filter(isLate).length; }

function itemsFor(v) { return v === 'todo' ? TODO : SHOP; }

function passesFilter(it) {
  if (filter === 'all') return true;
  if (filter === 'open') return !isDone(it.id);
  if (filter === 'done') return isDone(it.id);
  if (filter === 'star') return !!it.star;
  if (filter === 'late') return isLate(it);
  return it.p === filter || it.s === filter;
}

function liHTML(it) {
  const cls = [isDone(it.id) ? 'done' : '', it.star ? 'star' : ''].filter(Boolean).join(' ');
  const q = it.q ? '<span class="qty">' + val(it.q) + '</span>' : '';
  const who = it.who ? '<span class="who">' + it.who + '</span>' : '';
  const note = it.note ? '<span class="note">' + val(it.note) + '</span>' : '';
  return '<li class="' + cls + '" data-id="' + it.id + '"><div class="box"></div>' +
         '<div class="text"><span class="nm">' + it.nm + '</span>' + q + who + note + '</div></li>';
}

function renderList(target, groups, groupKey) {
  const items = itemsFor(view).filter(passesFilter);
  const lc = itemsFor(view).filter(isLate).length;
  let html = lc ? '<div class="latebar"><b>' + lc + (lc === 1 ? ' item is' : ' items are') +
    ' past their date.</b> Tap ⚠ Late to see just those.</div>' : '';
  groups.forEach(g => {
    const rows = items.filter(it => it[groupKey] === g.key);
    if (!rows.length) return;
    const openCt = rows.filter(it => !isDone(it.id)).length;
    const late = pastDue(g.due) && openCt > 0;
    html += '<div class="grp-head"><span>' + g.label + '</span>' +
            '<span class="when' + (late ? ' late' : '') + '">' +
            (late ? '⚠ overdue · was ' + g.when.replace(/^(by|order by) /, '') : g.when) + '</span>' +
            '<span class="ct">' + (rows.length - openCt) + '/' + rows.length + '</span></div>' +
            '<div class="card"><ul class="list">' + rows.map(liHTML).join('') + '</ul></div>';
  });
  if (!html) html = '<div class="callout"><p>Nothing here with that filter on.</p></div>';
  target.innerHTML = html;
}

function renderRun(target) {
  let html = '<div class="callout mud"><h4>The shape of the afternoon</h4>' +
    '<p>Swim first while everyone has energy, then feed them — post-swim hunger is real and it lands hard at 6pm. ' +
    'Craft and games afterwards, when they are fed and calm enough to sit. Cake last, close to going-home time.</p></div>' +
    '<div class="tl">';
  RUN.forEach(s => {
    html += '<div class="slot ' + s.cls + '">' +
      '<div class="rail"><div class="t">' + s.t + '</div><div class="t2">' + s.t2 + '</div></div>' +
      '<div class="spine"><div class="dot"></div></div>' +
      '<div class="body"><h3>' + s.h + '</h3><p>' + s.p + '</p>' +
      '<div class="tags">' + s.tags.map(t => '<span>' + t + '</span>').join('') + '</div></div></div>';
  });
  html += '</div>' +
    '<div class="callout grass"><h4>The cake</h4><p>Awfully Chocolate, plain top, no writing. Green buttercream through a #233 grass tip, ' +
    'two greens piped together so it does not read as a golf course. Figurines set in the grass, number 3 candle in the middle. ' +
    'Pipe it <strong>Friday night</strong> — Saturday morning is netball and then Merbok, and there is no window.</p></div>' +
    '<div class="callout"><h4>Evie</h4><p>Lily asks for her by name, so give her the small jobs: beside Lily at the pancake table, ' +
    'her craft partner, and the one holding the number 3 balloon in the cake photo. At three years old that is the whole party.</p></div>';
  target.innerHTML = html;
}

function renderFilters() {
  const f = document.getElementById('filters');
  let btns = [['all','All'],['open','To do'],['done','Done'],['star','⭐ Key']];
  if (lateCount()) btns.splice(1, 0, ['late','⚠ Late']);
  if (view === 'todo') PHASES.forEach(p => btns.push([p.key, p.label]));
  if (view === 'shop') STORES.forEach(s => btns.push([s.key, s.label.split(' —')[0].split(' /')[0]]));
  f.hidden = (view === 'run');
  f.innerHTML = btns.map(b =>
    '<button data-f="' + b[0] + '" class="' + (b[0] === 'star' || b[0] === 'late' ? 'star-f ' : '') + (filter === b[0] ? 'active' : '') + '">' + b[1] + '</button>'
  ).join('');
}

function renderProgress() {
  const all = TODO.concat(SHOP);
  const done = all.filter(it => isDone(it.id)).length;
  const pctv = all.length ? Math.round(done / all.length * 100) : 0;
  document.getElementById('pct').textContent = pctv + '%';
  document.getElementById('fill').style.width = pctv + '%';
}

function renderCountdown() {
  const now = new Date();
  const days = Math.ceil((PARTY - now) / 86400000);
  const el = document.getElementById('countdown');
  if (days > 1) el.textContent = days + ' days to go';
  else if (days === 1) el.textContent = 'Tomorrow';
  else if (days === 0) el.textContent = 'Today ✶';
  else el.textContent = 'Happy birthday, Lily ✶';
}

function render() {
  document.getElementById('v-kids').textContent = S.kids;
  document.getElementById('v-adults').textContent = S.adults;
  document.getElementById('paxbar').hidden = (view === 'run');
  document.getElementById('todo-view').hidden = view !== 'todo';
  document.getElementById('shop-view').hidden = view !== 'shop';
  document.getElementById('run-view').hidden  = view !== 'run';
  renderFilters();
  if (view === 'todo') renderList(document.getElementById('todo-view'), PHASES, 'p');
  if (view === 'shop') renderList(document.getElementById('shop-view'), STORES, 's');
  if (view === 'run')  renderRun(document.getElementById('run-view'));
  renderProgress();
  renderCountdown();
}

document.addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (li) { toggle(li.dataset.id); return; }
  const tab = e.target.closest('button.tab');
  if (tab) { view = tab.dataset.view; filter = 'all';
    document.querySelectorAll('button.tab').forEach(b => b.classList.toggle('active', b === tab));
    render(); return; }
  const fb = e.target.closest('#filters button');
  if (fb) { filter = fb.dataset.f; render(); return; }
});

render();
</script>
